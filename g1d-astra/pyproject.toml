[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g1d-whiteboard-demos"
version = "0.1.0"
description = "Closed-loop G1-D whiteboard demonstration interfaces."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "httpx>=0.27", "pillow", "opencv-python", "python-dotenv", "jupyterlab>=4"]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
